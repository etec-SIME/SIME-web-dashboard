<header class="header">
    <h2 id="titulo-pagina">{{ titulo }}</h2>

    <div class="acoes">
        <img src="/images/iconeNotificacao.svg" alt="Notificações" id="icone-notificacao">
        <button class="perfil" (click)="navegarParaPerfis()" *appHasPermission="['Atribuir Permissões Tipo de Perfil', 'Cadastrar Tipo de Perfil']">
            <p id="titulo-perfil">Perfis</p>
            <img src="/images/iconePerfil.svg" alt="Perfil" id="icone-perfil">
        </button>
    </div>
</header>
