<div class="chamados-local-container">
    <p>Chamados {{ambiente}}</p>

    <div *ngIf="chamadosFiltrados.length > 0; else nenhumChamado">
      <div class="chamados-cards-wrapper">
        <div class="chamados-cards">
          <div class="card" *ngFor="let chamado of chamadosFiltrados">
            <!--<img> Ícone do documento -->
            <div class="chamado-info">
              <p class="titulo-chamado">{{ chamado.tituloChamado }}</p>
              <p class="data-tipo-chamado">{{ chamado.dataAberturaFormatada }} - {{ chamado.nomeTipoChamado }}</p>
            </div>
            <!--<img> Imagem da seta -->
          </div>
        </div>
      </div>
    </div>

    <ng-template #nenhumChamado class="nenhum-chamado">
        <p>Nenhum chamado encontrado neste local.</p>
    </ng-template>

</div>
