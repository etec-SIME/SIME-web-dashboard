<div class="sidebar">
    <img class="logo" src="/images/logoSIME.png">

    <div class="menu">
        <div class="home" 
            [class.ativo]="opcaoAtual === 'home'" 
            (click)="opcaoAtual = 'home'; navegarHome()">
            <img class="iconeHome" src="/images/iconeHome.png">
            <p>Home</p>
        </div>

        <div class="pendentes" 
            [class.ativo]="opcaoAtual === 'pendentes'" 
            (click)="opcaoAtual = 'pendentes'">
            <img class="iconePendentes" src="/images/iconePendentes.png">
            <p>Pendentes</p>
        </div>

        <div class="concluidos" 
            [class.ativo]="opcaoAtual === 'concluidos'" 
            (click)="opcaoAtual = 'concluidos'">
            <img class="iconeConcluidos" src="/images/iconeConcluidos.png">
            <p>Concluídos</p>
        </div>

        <div class="criar" 
            [class.ativo]="opcaoAtual === 'criar'" 
            (click)="opcaoAtual = 'criar'">
            <img class="iconeCriar" src="/images/iconeCriar.png">
            <p>Criar</p>
        </div>
    </div>

    <button class="buttonCriar">Criar Chamado</button>
</div>
