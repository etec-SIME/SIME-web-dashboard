<form [formGroup]="chamadoForm" (ngSubmit)="onSubmit()" class="form-container">

    <div class="rows">
        <!-- Linha 1 -->
        <div class="form-row">
            <input type="date" formControlName="data" placeholder="Data" />
            <select formControlName="ambiente">
                <option value="">Local</option>
                @for (ambiente of ambiente; track ambiente.idAmbiente) {
                    <option [value]="ambiente.idAmbiente">
                        {{ ambiente.nomeAmbiente }}
                    </option>
                }
            </select>
        </div>
    
        <!-- Linha 2 -->
        <div class="form-row">
            <input type="email" formControlName="email" placeholder="Email" />
        </div>
    
        <!-- Linha 3 -->
        <div class="form-row">
            <select formControlName="tipoChamado">
                <option value="">Tipo Chamado</option>
                @for (tipoChamado of tiposChamado; track tipoChamado.idTipoChamado) {
                    <option [value]="tipoChamado.idTipoChamado">
                        {{ tipoChamado.nomeTipoChamado }}
                    </option>
                }
            </select>
    
            <input type="text" formControlName="problema" placeholder="Problema" />
        </div>
    
        <!-- Linha 4 -->
        <div class="form-row">
            <textarea formControlName="descricao" placeholder="Descrição"></textarea>
        </div>
        
        <!-- Linha 5 -->
        <div class="form-row">
            <input type="text" formControlName="equipamento" placeholder="Equipamento" />
            <input type="text" formControlName="codigoEquipamento" placeholder="Código do equipamento" />
        </div>
    </div>

    <div class="upload">
        <!-- Upload -->
        <div class="form-upload">
            <label for="anexo" id="anexo-title">Adicionar Anexo</label>
            <div id="anexo">
                <span id="file-name">Carregar do dispositivo</span>
                <label for="fileUpload" id="upload-btn">Navegar</label>
                <input type="file" id="fileUpload" (change)="onFileSelected($event)" hidden>
            </div>
        </div>
    
        <!-- Botão -->
        <div class="form-actions">
            <button type="submit" [disabled]="chamadoForm.invalid">Enviar</button>
        </div>
    </div>
</form>
