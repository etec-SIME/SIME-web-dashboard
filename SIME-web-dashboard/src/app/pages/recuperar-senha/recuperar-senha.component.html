<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="recuperar-senha.component.css">
</head>
<body>

    <app-pagina-de-fundo></app-pagina-de-fundo>

    <div class="recovery-container">

        <h1>RECUPERAR SENHA</h1>

        <div class="input-group">
            <img src="images/iconeEmail.png" class="input-icon">
            <input type="email" class="recovery-input" placeholder="CÓDIGO">
        </div>

        <div class="frase">
            <img src="images/certo.png" class="certo-icon">
            <p>Um código foi enviado ao email institucional</p>
        </div>

        <a class="reenviar">Enviar novamente</a>

        <button class="btn-enviar">ENVIAR CÓDIGO</button>

        <a class="link-red">Redefinir senha</a>

    </div>

</body>
</html>
