<div class="home-layout">
    <div class="home-content">
        <div class="filtrar">
            <p>Filtrar por:</p>
            <div class="filtrar opcoes">
                <button class="opcao" [class.ativa]="opcaoAtual === 'salas'" (click)="setOpcao('salas')">Salas</button>
                <button class="opcao" [class.ativa]="opcaoAtual === 'labs'" (click)="setOpcao('labs')">Labs</button>
                <button class="opcao" [class.ativa]="opcaoAtual === 'outros'" (click)="setOpcao('outros')">Outros</button>
            </div>
        </div>
    <!-- Criar aqui -->
    <!-- <div class="teste"></div> -->

        <div *ngIf="!carregado" class="loading">
          <p>Carregando dados...</p>
        </div>

        <div class="locais-cards">
          <div class="card" *ngFor="let card of cards">
            <p>{{ card.nome }}</p>
            <div class="chamados">
              <p>{{ card.chamados }}</p>
              <p class="text-chamado">Chamados</p>
            </div>
          </div>
        </div>

        <div *ngIf="carregado && cards.length === 0" class="sem-dados">
          <p>Nenhum ambiente encontrado.</p>
        </div>
