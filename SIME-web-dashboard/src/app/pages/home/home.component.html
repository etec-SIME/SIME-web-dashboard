<div class="home-layout">
    <div class="home-content">
        <div class="filtrar">
            <p>Filtrar por:</p>
            <div class="filtrar opcoes">
                <button class="opcao" (click)="setOpcao('salas')">Salas</button>
                <button class="opcao" (click)="setOpcao('labs')">Labs</button>
                <button class="opcao" (click)="setOpcao('outros')">Outros</button>
            </div>
        </div>
    <!-- Criar aqui -->
    <!-- <div class="teste"></div> -->

        <div class="locais-cards">
          <div *ngIf="opcaoAtual === 'salas'">
            <div class="card" *ngFor="let sala of salas">
              <p>{{ sala.nome }}</p>
              <div class="chamados">
                <p>{{ sala.chamados | number:'2.0' }}</p>
                <p class="text-chamado">Chamados</p>
              </div>
            </div>
          </div>

          <div *ngIf="opcaoAtual === 'labs'">
            <div class="card" *ngFor="let lab of labs">
              <p>{{ lab.nome }}</p>
              <div class="chamados">
                <p>{{ lab.chamados }}</p>
                <p class="text-chamado">Chamados</p>
              </div>
            </div>
          </div>

          <div *ngIf="opcaoAtual === 'outros'">
            <div class="card" *ngFor="let outro of outros">
              <p>{{ outro.nome }}</p>
              <div class="chamados">
                <p>{{ outro.chamados }}</p>
                <p class="text-chamado">Chamados</p>
              </div>
          </div>
