<!-- Voltar -->
<button id="btn-back" (click)="voltar()">
    <img src="images/iconeFlecha.svg" alt="ícone de flecha">Voltar
</button>

<div class="container">
    <div class="perfil-container">
        <div class="perfil-list">
            <div class="perfil-item">
                <button class="perfil-btn">
                    <img class="perfil-avatar" src="images/Group.svg" alt="avatar"/>
                    <div class="perfil-text">
                        <p id="nome">Usuário</p>
                        <p id="count">2 permissões</p>
                    </div>
                </button>
            </div>

            <div class="perfil-item">
                <button class="perfil-btn">
                    <img class="perfil-avatar" src="images/Group.svg" alt="avatar"/>
                    <div class="perfil-text">
                        <p id="nome">Gestor Geral</p>
                        <p id="count">7 permissões</p>
                    </div>
                </button>
            </div>

            <div class="perfil-item selected">
                <button class="perfil-btn">
                    <img class="perfil-avatar" src="images/Group.svg" alt="avatar"/>
                    <div class="perfil-text">
                        <p id="nome">Administrador</p>
                        <p id="count">9 permissões</p>
                    </div>
                </button>
            </div>
        </div>

        <button class="btn btn-create" (click)="abrirModal()">Criar</button>

        <!-- Modal -->
        @if (mostrarModal) {
            <div class="modal-overlay" style="background-color: rgba(0, 0, 0, 0.5);">
                <div class="modal-content">
                    <header class="modal-header">
                        <img src="assets/icons/user.svg" alt="ícone usuário" />
                        <h3>Criar novo tipo de perfil</h3>
                    </header>

                    <h4 class="modal-subtitle">Adicione</h4>

                    <form class="modal-form">
                        <label>
                        <input type="text" placeholder="NOME" />
                        </label>

                        <label class="select-wrapper">
                            <select>
                                <option value="" selected>DEPARTAMENTO (OPCIONAL)</option>
                                @for (dep of departamentos; track dep) {
                                    <option [value]="dep">{{ dep }}</option>
                                }
                            </select>
                        </label>

                        <div class="modal-actions">
                            <button type="button" class="btn-cancelar" (click)="fecharModal()">Cancelar</button>
                            <button type="submit" class="btn-criar">
                                <img src="assets/icons/add.svg" alt="ícone criar" />
                                Criar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        }
    </div>

    <div class="permissoes-panel">
        <div class="divider"></div>
        <form class="permissoes-form">
            <h2>ADICIONAR PERMISSÕES</h2>

            <div class="perm-list">
                <label class="perm-item">
                    <input type="checkbox" name="criar-chamado" />
                    <span>Criar chamado</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="aprovar-chamado" checked />
                    <span>Aprovar chamado</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="criar-perfil" checked />
                    <span>Criar novo perfil</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="criar-tipo-perfil" />
                    <span>Criar novo tipo de perfil</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="definir-prioridade" />
                    <span>Definir prioridade</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="comentar-chamado" checked />
                    <span>Comentar no chamado</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="reprovar-chamado" />
                    <span>Reprovar chamado</span>
                </label>
        
                <label class="perm-item">
                    <input type="checkbox" name="visualizar-tipos" />
                    <span>Visualizar todos os tipos de chamados</span>
                </label>
            </div>
            <div class="panel-actions">
                <button type="button" class="btn btn-save">Salvar</button>
            </div>
        </form>
    </div>
</div>
